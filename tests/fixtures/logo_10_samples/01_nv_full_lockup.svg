<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 68" width="440" height="68" fill="none">
  <defs>
    <linearGradient id="goldGradFull2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA52"/>
      <stop offset="35%" stop-color="#C9A227"/>
      <stop offset="70%" stop-color="#E2B84B"/>
      <stop offset="100%" stop-color="#9E7B15"/>
    </linearGradient>
    <linearGradient id="emeraldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AAE7A"/>
      <stop offset="100%" stop-color="#16835B"/>
    </linearGradient>
    <linearGradient id="sunYellowLineFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="30%" stop-color="#E2B84B"/>
      <stop offset="50%" stop-color="#FCE182"/>
      <stop offset="70%" stop-color="#E2B84B"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Left: Monogram Seal (diameter 54px, center at x=27) -->
  <g transform="translate(6, 7)">
    <!-- Clean Single Jupiter Gold Ring -->
    <circle cx="27" cy="27" r="24.5" fill="#FFFDF7" stroke="url(#goldGradFull2)" stroke-width="1.8"/>
    
    <!-- Star Accent -->
    <path d="M27 4.5 L28 7.5 L31 8.5 L28 9.5 L27 12.5 L26 9.5 L23 8.5 L26 7.5 Z" fill="url(#goldGradFull2)"/>

    <!-- Letters N in Emerald & V in Gold — Centered at x=27.0 in middle of yellow line -->
    <text x="19.25" y="33" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="700" fill="url(#emeraldGradFull)" text-anchor="middle">N</text>
    <text x="34.75" y="33" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="700" fill="url(#goldGradFull2)" text-anchor="middle">V</text>
    <!-- Sun Yellow Gradient line: V-side slightly to left, tiny touching NV -->
    <rect x="10" y="32.7" width="31.5" height="1.6" rx="0.4" fill="url(#sunYellowLineFull)"/>
  </g>

  <!-- Vertical Divider Separator in Emerald -->
  <rect x="75" y="12" width="2" height="44" fill="#16835B" opacity="0.85"/>

  <!-- Right: Bold Brand Typography in Gold & Emerald - NO BLACK! -->
  <g transform="translate(92, 0)">
    <!-- Main Title in Luxury Jupiter Gold -->
    <text x="0" y="33" font-family="'Cormorant Garamond', Georgia, serif" font-size="27" font-weight="700" fill="url(#goldGradFull2)" letter-spacing="4.8">NUMEROS VISION</text>
    
    <!-- Sun Yellow Gradient Accent Rule (Pure Straight Line tiny touching NUMEROS VISION) -->
    <rect x="0" y="33.8" width="280" height="2" fill="url(#sunYellowLineFull)"/>

    <!-- Tagline in Vibrant Mercury Emerald -->
    <text x="1" y="48" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="url(#emeraldGradFull)" letter-spacing="3.4">ANVEIL EVERY CHARM</text>
  </g>
</svg>