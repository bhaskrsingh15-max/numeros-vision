version: '3.8'

services:
  # 1. Numeros Vision Core & Charm AI Agent Engine
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: numeros_vision_app
    restart: always
    environment:
      - ENV=production
      - WEB_CONCURRENCY=9
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-numeros_vision_production_secret_key_change_me}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    networks:
      - internal_net

  # 2. Redis Distributed Session & Rate Limiting Store
  redis:
    image: redis:7.2-alpine
    container_name: numeros_vision_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal_net

  # 3. Nginx Edge Reverse Proxy & Static Asset Accelerator
  nginx:
    image: nginx:alpine
    container_name: numeros_vision_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../app/static:/usr/share/nginx/html/static:ro
    depends_on:
      - app
    networks:
      - internal_net

volumes:
  redis_data:

networks:
  internal_net:
    driver: bridge
