services:
  # =========================================================================
  # PREVIEW PDF SERVICE (Active target for Preview testing)
  # =========================================================================
  - type: web
    name: numeros-pdf-preview
    runtime: docker
    dockerfilePath: ./pdf_service/Dockerfile
    dockerContext: ./pdf_service
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: preview
      - key: PLANNER_2027_ALLOW_PLACEHOLDER_ON_PREVIEW
        value: "true"
      - key: PDF_SERVICE_SECRET
        sync: false

  # =========================================================================
  # PRODUCTION PDF SERVICE (Prepared — do not create until instructed)
  # =========================================================================
  - type: web
    name: numeros-pdf-prod
    runtime: docker
    dockerfilePath: ./pdf_service/Dockerfile
    dockerContext: ./pdf_service
    region: singapore
    plan: starter
    autoDeploy: false
    maxShutdownDelaySeconds: 30
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PLANNER_2027_ALLOW_PLACEHOLDER_ON_PREVIEW
        value: "false"
      - key: PDF_SERVICE_SECRET
        sync: false

  # =========================================================================
  # PREVIEW DETERMINISTIC ENGINE SERVICE (Charm AI + Tool Services + Logo Intelligence)
  # =========================================================================
  - type: web
    name: numeros-engine-preview
    runtime: docker
    dockerfilePath: ./engine_service/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: preview
      - key: CHARM_SERVICE_SECRET
        sync: false
      - key: ENGINE_SERVICE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # =========================================================================
  # PRODUCTION DETERMINISTIC ENGINE SERVICE (Prepared — wait for owner "go")
  # =========================================================================
  - type: web
    name: numeros-engine-prod
    runtime: docker
    dockerfilePath: ./engine_service/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    autoDeploy: false
    maxShutdownDelaySeconds: 30
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CHARM_SERVICE_SECRET
        sync: false
      - key: ENGINE_SERVICE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
