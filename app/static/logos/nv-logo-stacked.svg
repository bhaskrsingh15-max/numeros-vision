<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="goldGradStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA52"/>
      <stop offset="35%" stop-color="#C9A227"/>
      <stop offset="70%" stop-color="#E2B84B"/>
      <stop offset="100%" stop-color="#9E7B15"/>
    </linearGradient>
    <linearGradient id="emeraldGradStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AAE7A"/>
      <stop offset="100%" stop-color="#16835B"/>
    </linearGradient>
    <linearGradient id="sunYellowLineStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="30%" stop-color="#E2B84B"/>
      <stop offset="50%" stop-color="#FCE182"/>
      <stop offset="70%" stop-color="#E2B84B"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Top Monogram Seal (diameter 84, center at x=42) -->
  <g transform="translate(118, 14)">
    <!-- Clean Single Jupiter Gold Ring -->
    <circle cx="42" cy="42" r="39" fill="#FFFDF7" stroke="url(#goldGradStack)" stroke-width="2"/>
    
    <path d="M42 8 L43.5 12 L47.5 13.5 L43.5 15 L42 19 L40.5 15 L36.5 13.5 L40.5 12 Z" fill="url(#goldGradStack)"/>

    <!-- Letters N and V centered at x=42.0 directly in middle of yellow line -->
    <text x="31.4" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="url(#emeraldGradStack)" text-anchor="middle">N</text>
    <text x="52.6" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="url(#goldGradStack)" text-anchor="middle">V</text>
    <!-- Sun Yellow Gradient line: V-side slightly to left, tiny touching NV -->
    <rect x="14.5" y="51.7" width="50.5" height="1.8" rx="0.4" fill="url(#sunYellowLineStack)"/>
  </g>

  <!-- Brand Title in Jupiter Gold - NO BLACK! -->
  <text x="160" y="142" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="700" fill="url(#goldGradStack)" text-anchor="middle" letter-spacing="4.8">NUMEROS VISION</text>
  
  <!-- Sun Yellow Gradient Divider (Pure Straight Line tiny touching NUMEROS VISION) -->
  <rect x="65" y="142.8" width="190" height="2.2" rx="0.5" fill="url(#sunYellowLineStack)"/>

  <!-- Taglines in Mercury Emerald & Gold - NO BLACK! -->
  <text x="160" y="162" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="url(#emeraldGradStack)" text-anchor="middle" letter-spacing="3.4">ANVIEL EVERY CHARM</text>
  <text x="160" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" fill="#9E7B15" text-anchor="middle" letter-spacing="2.2">SCIENTIFIC NUMEROLOGY · AI PRECISION</text>
</svg>