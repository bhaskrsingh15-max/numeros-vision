<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <!-- Venus Pearl Background -->
  <rect width="180" height="180" fill="#FFFDF7"/>
  
  <!-- Yellow / Jupiter Gold Outline Square (with generous 18px outer space) -->
  <rect x="18" y="18" width="144" height="144" stroke="#E2B84B" stroke-width="2.6" fill="none"/>
  
  <!-- NV Monogram centered with generous inner space / padding -->
  <text x="65" y="98" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="62" font-weight="700" fill="#16835B" text-anchor="middle">N</text>
  <text x="115" y="98" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="62" font-weight="700" fill="#C9A227" text-anchor="middle">V</text>
  
  <!-- Yellow/Gold Accent Divider -->
  <rect x="42" y="112" width="96" height="2.2" fill="#E2B84B"/>
  
  <!-- Official Brand Name & Tagline -->
  <text x="90" y="128" font-family="'Cinzel', 'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#8B6914" text-anchor="middle" letter-spacing="2.2">NUMEROS VISION</text>
  <text x="90" y="142" font-family="'Cinzel', 'Inter', sans-serif" font-size="6.8" font-weight="700" fill="#16835B" text-anchor="middle" letter-spacing="1.8">ANVEIL EVERY CHARM</text>
</svg>
