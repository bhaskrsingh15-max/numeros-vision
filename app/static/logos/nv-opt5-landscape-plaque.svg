<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" fill="none">
  <!-- Venus Pearl Background -->
  <rect width="320" height="120" fill="#FFFDF7"/>
  
  <!-- Outer Yellow / Gold Landscape Rectangle -->
  <rect x="12" y="14" width="296" height="92" fill="#FFFDF7" stroke="#E2B84B" stroke-width="2.4"/>
  
  <!-- Corner Filigree Accents -->
  <path d="M20 22 L28 22 M20 22 L20 30" stroke="#C9A227" stroke-width="1.4"/>
  <path d="M300 22 L292 22 M300 22 L300 30" stroke="#C9A227" stroke-width="1.4"/>
  <path d="M20 98 L28 98 M20 98 L20 90" stroke="#C9A227" stroke-width="1.4"/>
  <path d="M300 98 L292 98 M300 98 L300 90" stroke="#C9A227" stroke-width="1.4"/>
  
  <!-- Left: Monogram Frame -->
  <text x="56" y="68" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="44" font-weight="700" fill="#16835B" text-anchor="middle">N</text>
  <text x="86" y="68" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="44" font-weight="700" fill="#C9A227" text-anchor="middle">V</text>
  <rect x="42" y="77" width="60" height="2" fill="#16835B"/>
  
  <!-- Center Vertical Divider -->
  <rect x="118" y="24" width="1.6" height="72" fill="#E2B84B" opacity="0.6"/>
  
  <!-- Right: Wordmark & Tagline -->
  <text x="134" y="52" font-family="'Cinzel', serif" font-size="18" font-weight="800" fill="#1C1917" letter-spacing="2.4">NUMEROS VISION</text>
  <rect x="134" y="62" width="154" height="1.8" fill="#16835B"/>
  <text x="134" y="78" font-family="'Cinzel', 'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#8B6914" letter-spacing="2">ANVEIL EVERY CHARM</text>
</svg>
