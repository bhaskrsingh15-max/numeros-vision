name = "numeros-vision"
pages_build_output_dir = "dist_cloudflare_pages"
compatibility_date = "2026-10-21"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://numerosvision.com,https://www.numerosvision.com"
NV_LAUNCH_STARTS_AT = ""
NV_LAUNCH_ENDS_AT = ""
NV_ENABLE_LAYERS_2_3 = "0"

# Cloudflare D1 Database Binding (Production)
[[d1_databases]]
binding = "DB"
database_name = "numeros-vision-db"
database_id = "18c0b0aa-b252-4c3f-bfee-37c9b8062d83"
migrations_dir = "migrations"

# Cloudflare R2 Bucket Binding (Production Private PDF Storage)
[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "numeros-reports-private"

# ── PREVIEW ENVIRONMENT (--branch preview) ───────────────────────────────
[env.preview.vars]
ENVIRONMENT = "preview"
ALLOWED_ORIGINS = "https://preview.numeros-vision.pages.dev,https://numeros-vision.pages.dev"
NV_FORCE_LAUNCH_MODE = "1"
NV_LAUNCH_STARTS_AT = ""
NV_LAUNCH_ENDS_AT = ""
NV_ENABLE_LAYERS_2_3 = "1"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "numeros-vision-db-preview"
database_id = "5c8c33e5-8782-48cd-8404-41b881e9eb4b"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "numeros-reports-private-preview"
